[package]
name = "bootcan"
version = "0.3.2"
description = "A cross-platform CAN/CAN FD network monitoring and analysis tool"
authors = ["bootCAN Team"]
edition = "2021"

[lib]
name = "bootcan_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "1"
log = "0.4"
env_logger = "0.10"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4"] }
csv = "1.3"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
rayon = "1"
crossbeam-channel = "0.5"
mcap = { version = "0.19", features = ["zstd"] }

# PCAN support via dlopen'd PCBUSB/PCANBasic library (Windows/macOS)
[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
libloading = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

# SocketCAN support (Linux only)
[target.'cfg(target_os = "linux")'.dependencies]
socketcan = "3"
nix = { version = "0.27", features = ["net"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

